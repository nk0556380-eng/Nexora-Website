<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eceae4;font-family:Inter,Arial,Helvetica,sans-serif;color:#111;font-size:13px}
  .sheet{max-width:820px;margin:24px auto;background:#fff;padding:36px 40px;position:relative;display:flex;flex-direction:column;min-height:1120px}
  .head{display:flex;justify-content:space-between;gap:20px}
  .brand{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:34px;margin:0}
  .logo{height:110px;width:auto;display:block;margin-bottom:6px;border-radius:6px}
  .co{font-size:12px;line-height:1.5;color:#333;margin-top:4px}
  .co b{color:#111}
  .ttl{text-align:right}
  .ttl h1{font-size:15px;letter-spacing:.2em;margin:0}
  .ttl small{font-size:10px;letter-spacing:.14em;color:#555}
  .meta{display:flex;justify-content:space-between;gap:20px;margin:26px 0 18px}
  .bill{font-size:12px;line-height:1.55;color:#333}
  .bill b{color:#111;font-size:13px}
  .lbl{color:#666}
  .kv{display:grid;grid-template-columns:auto auto;gap:5px 28px;font-size:12px;align-content:start}
  .kv span:nth-child(odd){text-align:right;color:#555}
  .kv span:nth-child(even){text-align:right;font-weight:600}
  table{width:100%;border-collapse:collapse}
  thead th{background:#111;color:#fff;font-size:11px;text-align:left;padding:7px 8px;font-weight:600}
  td{padding:13px 8px;font-size:12px;border-bottom:1px solid #ddd;vertical-align:top}
  .r{text-align:right}
  .sum{margin-left:auto;width:290px;margin-top:10px;font-size:11px}
  .sum div{display:flex;justify-content:space-between;padding:2px 8px}
  .sum .tot{font-size:17px;font-weight:700;padding-top:6px}
  .words{display:flex;justify-content:space-between;gap:16px;font-size:10.5px;color:#444;border-bottom:2px solid #111;padding:6px 8px 7px;margin-top:6px}
  .pay{display:flex;justify-content:space-between;font-size:12px;padding:3px 8px;font-weight:600}
  .bank{display:flex;gap:28px;margin-top:22px;align-items:flex-start}
  .bank h3,.sec h3{font-size:12px;margin:0 0 6px}
  #qr{width:104px;height:104px}
  #qr img{width:104px!important;height:104px!important}
  .bd{display:grid;grid-template-columns:auto auto;gap:3px 12px;font-size:11px}
  .bd span:nth-child(odd){color:#555}
  .bd span:nth-child(even){font-weight:600}
  .sign{margin-left:auto;text-align:center;font-size:10.5px;color:#444;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between}
  .stamp{display:inline-block;border:2px solid #2f7d4a;color:#2f7d4a;font-weight:700;letter-spacing:.2em;padding:5px 14px;transform:rotate(-8deg);font-size:15px;border-radius:4px}
  .sec{margin-top:18px;font-size:10.5px;line-height:1.55;color:#444}
  .sec ol{margin:0;padding-left:16px}
  .sec.pp{margin-top:12px;margin-bottom:24px}
  .pts{margin:6px 0 0;padding-left:16px;font-size:11px;color:#555;line-height:1.6}
  .foot{text-align:center;font-size:10px;color:#888;margin-top:auto;border-top:1px solid #ddd;padding-top:10px}
  .actions{text-align:center;margin:0 0 30px}
  .actions button{background:#111;color:#fff;border:0;border-radius:999px;padding:11px 26px;font-size:14px;cursor:pointer}
  .demo{background:#fff4d6;color:#7a5b00;font-size:11px;text-align:center;padding:5px;border-radius:4px;margin-bottom:14px;letter-spacing:.04em}
  @media(max-width:640px){.sheet{padding:22px 16px;margin:0;min-height:auto}.head,.meta,.bank{flex-direction:column}.ttl{text-align:left}.sign{margin:0;align-self:auto}.sum{width:100%}.sheet{overflow-x:auto}}
  @media print{body{background:#fff}.sheet{margin:0;max-width:none;padding:12mm;min-height:290mm}.actions,.demo{display:none}@page{size:A4;margin:0}}
</style>

const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const two=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
function words(n){
  if(!n) return 'Zero';
  const p=[[Math.floor(n/1e7),'Crore'],[Math.floor(n%1e7/1e5),'Lakh'],[Math.floor(n%1e5/1e3),'Thousand'],[Math.floor(n%1e3/100),'Hundred']];
  let s=p.filter(x=>x[0]).map(x=>two(x[0])+' '+x[1]).join(' ');
  const r=n%100; if(r) s+=(s?' And ':'')+two(r);
  return s.trim();
}
const inr=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

function render(data){
const INV={...BASE,...data};
document.title="Invoice "+INV.number+" — "+INV.from.name;
const taxable=INV.items.reduce((s,i)=>s+i.rate*i.qty,0);
const subtotal=taxable, total=subtotal-INV.discount, balance=total-INV.paid;
const qty=INV.items.reduce((s,i)=>s+i.qty,0);

document.getElementById('inv').innerHTML = `
  <div class="head">

  </div>

  <div class="meta">

/* ===== LOAD PER-INVOICE DATA FROM BACKEND ===== */
const API_URL = "https://nexorabackend-1v8q.onrender.com/api/invoices/";
function mapData(d){
  const s=d.seller||{}, c=d.client||{}, paid=!!d.paid;
  const items=(d.items||[]).map(i=>({name:i.description,rate:Number(i.amount),qty:1}));
  const total=items.reduce((a,i)=>a+i.rate,0);
  const date=new Date(d.issuedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  return {
    number:d.number, date, due:'',
    status: paid?'Paid':'Unpaid', discount:0, paid: paid?total:0,
    payMode:'', paidOn:'',
    from:{...BASE.from, name:s.name||BASE.from.name, addr:s.address||'', mobile:s.phone||'', email:s.email||''},
    to:{name:c.name||'', biz:c.business||'', phone:c.phone||'', addr:''},
    items, notes:d.note||BASE.notes
  };
}
(function(){
  const box=document.getElementById('inv');
  const t=new URLSearchParams(location.search).get('t')||'';
  if(!t){ render({}); box.insertAdjacentHTML('afterbegin','<div class="demo">DEMO PREVIEW — sample data (a real invoice link has ?t=...)</div>'); return; }
  box.innerHTML='<p style="padding:60px;text-align:center;color:#666">Loading invoice… (the first load can take up to a minute)</p>';
  fetch(API_URL+encodeURIComponent(t))
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>render(mapData(d)))
    .catch(()=>{box.innerHTML='<p style="padding:60px;text-align:center;color:#666">Invoice not found. Please check your link.</p>';});
})();
